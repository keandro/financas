<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Finanças</title>
    <style>
      :root {
        color-scheme: dark;
        --fundo: #020617;
        --painel: #0f172a;
        --borda: #1e293b;
        --texto: #f1f5f9;
        --suave: #94a3b8;
        --verde: #059669;
        --verde-claro: #34d399;
        --erro: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        background: var(--fundo);
        color: var(--texto);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { width: 100%; max-width: 380px; }
      .logo {
        display: grid; place-items: center;
        width: 56px; height: 56px; margin: 0 auto 12px;
        border-radius: 16px; background: var(--verde);
        font-weight: 700; font-size: 20px; color: #fff;
      }
      h1 { margin: 0 0 4px; text-align: center; font-size: 22px; }
      .sub { margin: 0 0 24px; text-align: center; color: var(--suave); font-size: 14px; }
      .painel { background: var(--painel); border: 1px solid var(--borda); border-radius: 16px; padding: 20px; }
      label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
      input {
        width: 100%; padding: 12px 14px; border-radius: 10px;
        border: 1px solid #334155; background: var(--fundo); color: var(--texto);
        font-size: 16px; outline: none;
      }
      input:focus { border-color: var(--verde); box-shadow: 0 0 0 3px rgb(5 150 105 / 0.3); }
      .dica { margin: 8px 0 0; color: var(--suave); font-size: 13px; }
      button {
        width: 100%; margin-top: 16px; padding: 13px; border: 0; border-radius: 10px;
        background: var(--verde); color: #fff; font-size: 16px; font-weight: 600;
      }
      button:disabled { opacity: 0.6; }
      .msg { margin: 14px 0 0; font-size: 14px; }
      .msg.erro { color: var(--erro); }
      .msg.ok { color: var(--verde-claro); }
      .carregando { text-align: center; color: var(--suave); }
      .giro {
        width: 28px; height: 28px; margin: 0 auto 12px;
        border: 3px solid var(--borda); border-top-color: var(--verde-claro);
        border-radius: 50%; animation: giro 0.8s linear infinite;
      }
      @keyframes giro { to { transform: rotate(360deg); } }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">R$</div>
      <h1>Finanças</h1>
      <p class="sub">Conecta ao sistema rodando no seu computador</p>

      <div id="carregando" class="carregando" hidden>
        <div class="giro"></div>
        <p id="carregando-texto">Conectando…</p>
      </div>

      <form id="form" class="painel" hidden>
        <label for="endereco">Endereço do servidor</label>
        <input id="endereco" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="192.168.18.204:3001" />
        <p class="dica">O PC precisa estar ligado e o celular no mesmo Wi-Fi.</p>
        <button id="conectar" type="submit">Conectar</button>
        <p id="msg" class="msg" role="status" hidden></p>
      </form>
    </main>

    <script>
      const CHAVE = "financas_servidor";
      const PADRAO = "192.168.18.204:3001";
      const $ = (id) => document.getElementById(id);

      function lerSalvo() {
        try { return localStorage.getItem(CHAVE); } catch { return null; }
      }
      function salvar(url) {
        try { localStorage.setItem(CHAVE, url); } catch {}
      }

      /** "192.168.18.204" → "http://192.168.18.204:3001" (porta 3001 se não informada) */
      function normalizar(texto) {
        let t = (texto || "").trim();
        // só host (letras, números, ponto, hífen) + porta opcional
        if (!/^(https?:\/\/)?[a-z0-9.-]+(:\d{1,5})?\/?$/i.test(t)) return null;
        const temPorta = /:\d+(\/|$)/.test(t.replace(/^https?:\/\//i, ""));
        if (!/^https?:\/\//i.test(t)) t = "http://" + t;
        try {
          const u = new URL(t);
          if (!temPorta && u.protocol === "http:") u.port = "3001";
          return u.origin;
        } catch {
          return null;
        }
      }

      /** Resolve true se o servidor responder (no-cors: só importa se a conexão abriu). */
      async function alcancavel(url) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 5000);
        try {
          await fetch(url + "/api/health", { mode: "no-cors", cache: "no-store", signal: ctrl.signal });
          return true;
        } catch {
          return false;
        } finally {
          clearTimeout(timer);
        }
      }

      function mostrarForm(valor, erro) {
        $("carregando").hidden = true;
        $("form").hidden = false;
        $("endereco").value = valor || "";
        mensagem(erro, "erro");
      }

      function mensagem(texto, tipo) {
        const m = $("msg");
        m.hidden = !texto;
        m.textContent = texto || "";
        m.className = "msg " + (tipo || "");
      }

      function abrir(url) {
        // replace: a tela de configuração não fica no histórico (voltar no sistema fecha o app)
        location.replace(url + "/");
      }

      $("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const url = normalizar($("endereco").value);
        if (!url) return mensagem("Endereço inválido. Ex.: " + PADRAO, "erro");
        $("conectar").disabled = true;
        mensagem("Testando conexão…");
        const ok = await alcancavel(url);
        $("conectar").disabled = false;
        if (!ok) return mensagem("Não foi possível conectar em " + url + ". Verifique se o PC está ligado e no mesmo Wi-Fi.", "erro");
        salvar(url);
        mensagem("Conectado!", "ok");
        abrir(url);
      });

      (async function iniciar() {
        const salvo = lerSalvo();
        const configurar = new URLSearchParams(location.search).has("config");
        if (!salvo || configurar) {
          return mostrarForm((salvo || "").replace(/^http:\/\//, "") || PADRAO);
        }
        $("carregando").hidden = false;
        $("carregando-texto").textContent = "Conectando a " + salvo.replace(/^https?:\/\//, "") + "…";
        if (await alcancavel(salvo)) return abrir(salvo);
        mostrarForm(salvo.replace(/^http:\/\//, ""), "Não foi possível conectar. Verifique se o PC está ligado e no mesmo Wi-Fi, e toque em Conectar para tentar de novo.");
      })();
    </script>
  </body>
</html>
